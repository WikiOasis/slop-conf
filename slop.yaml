root: /srv

log-dir: /var/log/slop

lock-dir: /var/lib/slop/locks

default: mediawiki

gerrit: https://gerrit.wikimedia.org/r

sal:
  enabled: true
  client-config: /etc/sal/client.json

notify:
  secrets-file: /etc/slop/secrets.yaml

config-repo:
  remote: origin
  branch: main
  pull: true
  push: true

projects:
  mediawiki:
    type: mediawiki
    path: mediawiki-build
    link-root: /srv/mediawiki
    mw-config:
      url: https://github.com/WikiOasis/mw-config.git
      branch: main
    versions:
      '1.46':
        core:
          url: https://gerrit.wikimedia.org/r/mediawiki/core.git
          branch: _version_
      '1.47':
        core:
          url: https://gerrit.wikimedia.org/r/mediawiki/core.git
          branch: _version_
    deploy:
      path: /srv/mediawiki
      roles:
        - canary
        - app
        - jobrunner
      owner: www-data:www-data
      checks:
        host: test.wikioasis.org
        url: http://127.0.0.1
        retries: 3
        tests:
          - name: main page
            path: /wiki/Main_Page
            expect: wikioasis
          - name: api.php
            path: /w/api.php?action=query&meta=siteinfo&format=json
            expect: '"sitename"'
          - name: load.php
            path: /w/load.php?modules=startup&only=scripts&raw=1
            expect: mw.loader
          - name: rest.php
            path: /w/rest.php/v1/page/Main_Page/bare
            expect: '"latest"'
          - name: Special:Version
            path: /wiki/Special:Version
            expect: MediaWiki
            roles:
              - canary
          - name: Special:RecentChanges
            path: /wiki/Special:RecentChanges
            expect: mw-changeslist
            roles:
              - canary
          - name: Special:Search
            path: /w/index.php?title=Special:Search&search=test&fulltext=1
            expect: mw-search
            roles:
              - canary
      l10n:
        when: auto
        wiki: testwiki

  tsportal:
    type: service
    path: tsportal-build
    url: https://github.com/WikiOasis/TSPortal.git
    branch: main
    build:
      - composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - npm ci --no-audit --no-fund
      - VITE_APP_NAME=TSPortal npm run build
    deploy:
      path: /srv/tsportal
      roles:
        - apps
      owner: www-data:www-data
      exclude:
        - .git
        - .slop
        - /.env
        - /.composer
        - /.npm
        - /node_modules
        - /storage
        - /bootstrap/cache
      once:
        - sudo -n -u www-data /usr/bin/php8.4 {path}/artisan migrate --force
      after-sync:
        - sudo -n -u www-data /usr/bin/php8.4 {path}/artisan optimize
      checks:
        host: safety.wikioasis.org
        url: http://127.0.0.1
        retries: 3
        forbid:
          - Whoops
          - Server Error
          - Fatal error
        tests:
          - name: health
            path: /up
            headers:
              - 'X-Forwarded-Proto: https'

  jobrunner:
    type: service
    path: jobrunner-build
    url: https://github.com/wikimedia/mediawiki-services-jobrunner.git
    branch: master
    deploy:
      path: /srv/mediawiki-services-jobrunner
      roles:
        - jobrunner
      owner: root:root
      restart:
        - jobrunner
